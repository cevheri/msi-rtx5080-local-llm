[
 {
  "id": "llm-pi-ai",
  "config": {
   "providers": {
    "llmctl": {
     "displayName": "llmctl",
     "api": "openai-completions",
     "baseURL": "http://127.0.0.1:18080/v1",
     "headers": {
      "Authorization": "Bearer no-key-required"
     },
     "compat": {
      "supportsStore": false,
      "supportsDeveloperRole": false,
      "maxTokensField": "max_tokens"
     },
     "models": [
      {
       "id": "local",
       "name": "bolt candidate (llmctl)",
       "contextWindow": 131072,
       "maxTokens": 16384,
       "input": [
        "text"
       ],
       "reasoningEfforts": {
        "off": null,
        "medium": "medium",
        "high": "high"
       },
       "compat": {
        "thinkingFormat": "chat-template",
        "chatTemplateKwargs": {
         "enable_thinking": {
          "$var": "thinking.enabled"
         },
         "medium_effort": {
          "$var": "thinking.budget"
         }
        }
       }
      }
     ],
     "thinkingBudgets": {
      "medium": 1,
      "high": 0
     }
    }
   }
  }
 },
 {
  "id": "agent-default-model",
  "config": {
   "provider": "llmctl",
   "model": "local",
   "reasoningEffort": "medium"
  }
 }
]
