# Draft llama.cpp recipe for the SGLang work (2026-11-17), an estimate that a measurement lane finalizes.
# [model] is exact, read from the Hugging Face API on 2026-11-17.
# The args are those of recipes/llamacpp/gemma-4-26b-a4b.toml (same family, same sampling and thinking switch)
# without its expert-offload flags (--n-cpu-moe 12, -lm none, -t 8, --moe-cache-mib 2368), because this
# dense 4.80 GiB file fits whole on the GPU; f16 KV stays, as there, for the 512-wide global heads.
# 131072 is the model's max_position_embeddings; whether b12407 handles E4B's per-layer embeddings is not run.
# memory_gib is copied from that recipe; gpu_mib is an estimate (see [needs]).
schema = 1
id = "gemma-4-e4b"
name = "Gemma 4 E4B IT QAT Q4_0"
aliases = ["gemma4-e4b"]
doc = "docs/superpowers/research/2026-11-17-sglang/research-report.md#4-per-model-and-engine"
opencode = false

[model]
repo = "google/gemma-4-E4B-it-qat-q4_0-gguf"
revision = "4b4a2c1d584be7264f87aac328a1bc739ce81b6c"
# gemma-4-E4B_q4_0-it.gguf: SHA-256 676c35070db6dbe52f93e9c864ee0fba4eddea94b9c875d9cb10daff453fbaee, 5,154,941,280 bytes
files = ["gemma-4-E4B_q4_0-it.gguf"]
size_bytes = 5154941280

[container]
memory_gib = 20

[server]
context = 131072
args = [
  "-ngl", "all", "-fa", "on", "-np", "1", "--jinja", "-ctxcp", "16", "--reasoning", "off",
  "--temp", "1.0", "--top-p", "0.95", "--top-k", "64",
]

[clients]
output = 16384
thinking = "toggle"
default = "off"

[needs]
# Estimate, an upper bound: 4.80 GiB of weights if the per-layer embedding table stays on the GPU, 3.50 GiB of
# f16 global KV at 128k if all 7 global layers keep their own cache (7 x 2 KV heads x (512 + 512) x 2 B; 2.00 GiB
# if only the 4 layers before the 18 shared ones do), 0.04 GiB of sliding-window KV and about 0.8 GiB of context
# and buffers. Replace it with the measured peak minus the desktop's 112 MiB, and add ram_gib from the measurement.
gpu_mib = 9216

[evidence]
kind = "estimate"
summary = "Draft from the SGLang research report, section 4, with the args of the shipped gemma-4-26b-a4b recipe less its expert offload; not measured on this laptop"
doc = "docs/superpowers/research/2026-11-17-sglang/research-report.md#4-per-model-and-engine"
