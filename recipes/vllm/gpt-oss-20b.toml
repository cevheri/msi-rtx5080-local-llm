# The launch that started on the reference laptop, from vllm/models.md (gpt-oss-20b).
schema = 1
id = "gpt-oss-20b"
name = "gpt-oss-20b MXFP4 (vLLM, eager mode)"
aliases = ["gpt-oss"]
doc = "vllm/models.md#gpt-oss-20b"
opencode = true

[model]
repo = "openai/gpt-oss-20b"
revision = "6cee5e81ee83917806bbde320786a8fb61efebee"
exclude = ["original/*", "metal/*"]
size_bytes = 13789264674
served_name = "gpt-oss-20b"

[container]
memory_gib = 32

[server]
context = 65536
args = [
  "--gpu-memory-utilization", "0.965", "--max-num-seqs", "1", "--max-num-batched-tokens", "256",
  "--enforce-eager", "--kv-cache-dtype", "fp8", "--attention-backend", "TRITON_ATTN",
  "--enable-auto-tool-choice", "--tool-call-parser", "openai", "--reasoning-parser", "openai_gptoss",
  "--reasoning-effort-map", '{"none":"low","minimal":"low","xhigh":"high","max":"high"}',
  "--override-generation-config", '{"temperature":1.0,"top_p":1.0}',
]

[evidence]
kind = "measured"
summary = "83.5 tok/s decode in eager mode with 64k context, 15,698 MiB GPU memory, OpenCode session passed"
