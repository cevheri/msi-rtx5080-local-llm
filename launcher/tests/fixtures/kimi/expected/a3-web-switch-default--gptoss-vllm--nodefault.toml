# ~/.kimi-code/config.toml
# Environment settings for Kimi Code.
# This file starts empty so built-in defaults can apply.
# Login will populate managed Kimi provider and model entries.
default_model = "other/m"

[providers.llmctl]
type = "openai"
base_url = "http://127.0.0.1:8000/v1"
api_key = "no-key-required"
model_source = "static"

[models."llmctl/gpt-oss-20b"]
provider = "llmctl"
model = "gpt-oss-20b"
display_name = "gpt-oss-20b on vLLM (llmctl)"
max_context_size = 65536
max_output_size = 16384
capabilities = ["tool_use", "thinking"]
support_efforts = ["low", "medium", "high"]
default_effort = "medium"

# owner comment: a second, hand-written provider
[providers.other]
type = "openai"
base_url = "http://127.0.0.1:9999/v1"
api_key = "placeholder"

[models."other/m"]
provider = "other"
model = "m"
max_context_size = 8192
